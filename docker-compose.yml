# yaml-language-server: $schema=
#
# Single entry point for the whole system: the backend API, Redis, and the
# admin console (../resolv-hq, a Vite + React SPA, port 3000) and the customer
# web app (../resolv-hq-customer, an Expo web build, port 8083), plus an nginx
# reverse proxy for the admin app. Each frontend owns its Dockerfile (Docker
# needs it next to that app's source to build); only the orchestration layer
# lives here.
#
# Every service is `restart: unless-stopped`, so the stack keeps running (and
# comes back after a Docker/PC restart) without `npm run dev` in either repo.
# It only changes when you rebuild, from this directory:
#   docker compose build && docker compose up -d
#
# `docker compose up` from this directory reads .env in THIS directory for
# every ${VAR} below, including the admin app's build args — see
# .env.example for the full list this file needs.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Overrides whatever REDIS_URL is in .env — inside Compose, Redis is
      # only ever reachable by its service name, never localhost.
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - redis
      - rabbitmq
    ports:
      # Host port 3001 -> the API's PORT (4000) inside the container. Host side
      # is overridable (BACKEND_HOST_PORT in .env).
      - "${BACKEND_HOST_PORT:-3001}:4000"
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      # Published to the host (not just `expose`) so a locally-run
      # `npm run dev` (outside Docker) can also reach it at localhost:6379 —
      # useful for iterating on rate-limit/caching code with hot reload
      # while still using the Dockerized Redis.
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    # Message bus between the services. 5672 is AMQP; 15672 is the management
    # UI (guest / guest), handy for watching the resolv.console queue.
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  admin-app:
    build:
      context: ../resolv-hq
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL}}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}}
        # Baked into the browser bundle — must be host-reachable (default:
        # the admin-nginx port below), not the Docker-network address.
        VITE_API_BASE_URL: ${ADMIN_PUBLIC_API_BASE_URL:-http://localhost:3001}
    depends_on:
      - backend
    ports:
      # The admin console, served directly on host port 3000.
      - "3000:3000"
    restart: unless-stopped

  customer-web:
    build:
      context: ../resolv-hq-customer
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_SUPABASE_URL: ${VITE_SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL}}
        EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}}
        # Baked into the browser bundle — must be host-reachable.
        EXPO_PUBLIC_API_BASE_URL: ${ADMIN_PUBLIC_API_BASE_URL:-http://localhost:3001}
    depends_on:
      - backend
    ports:
      # The customer web app, on host port 8083 (8081 is left free for Expo/Metro).
      - "8083:80"
    restart: unless-stopped

  admin-nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/admin-app.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - admin-app
    restart: unless-stopped
