# Render Blueprint. Dev -> staging, main -> production.
# Secrets are declared with sync: false and filled in the Render dashboard
# (see docs/deployment.md); they are never stored in this file.
#
# autoDeployTrigger: checksPass deploys only after the GitHub Actions checks
# (docker-image.yml: build + tests) pass on that branch.

services:
  - type: web
    name: resolv-hq-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    # Free instances have no preDeployCommand, so migrations run at start.
    # A failed migration exits the container and the deploy is marked failed.
    dockerCommand: npm run start:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false

  - type: web
    name: resolv-hq-backend-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: Dev
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    dockerCommand: npm run start:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
