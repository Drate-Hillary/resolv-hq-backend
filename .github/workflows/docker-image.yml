name: Resolv-Hq Backend Docker Image CI

on:
  push:
    branches: [ "Dev" ]
  pull_request:
    branches: [ "Dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Required permissions to push to GitHub Container Registry (GHCR)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image repository
        # GHCR (like all Docker registries) requires a lowercase repository
        # name, but github.repository preserves this repo's actual case
        # (Drate-Hillary/resolv-hq-backend) — lowercase it here rather than
        # inline in the tag, since build-push-action rejects a mixed-case
        # tag outright.
        run: echo "IMAGE_REPOSITORY=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Only push to the registry if it's a direct push to Dev (not a PR)
          push: ${{ github.event_name != 'pull_request' }}
          # Dynamically tags it using your github username and repo name
          tags: ghcr.io/${{ env.IMAGE_REPOSITORY }}:dev
          # Enables caching to significantly speed up future builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  deploy:
    needs: build
    # Only run the deployment if the trigger was a push to Dev, not a PR
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set lowercase image repository
        run: echo "IMAGE_REPOSITORY=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Pull and Restart Container
        run: |
          # Pull the newly built image from GHCR
          docker pull ghcr.io/${{ env.IMAGE_REPOSITORY }}:dev
          
          # Stop and remove the old container (suppressing errors if it doesn't exist)
          docker stop resolv-hq-backend || true
          docker rm resolv-hq-backend || true
          
          # Run the new container (adjust ports and env vars as needed for your backend)
          docker run -d \
            --name resolv-hq-backend \
            --restart unless-stopped \
            -p 8080:8080 \
            ghcr.io/${{ env.IMAGE_REPOSITORY }}:dev