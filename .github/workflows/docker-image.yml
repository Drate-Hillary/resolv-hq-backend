name: Resolv-Hq Backend CI/CD

# Dev -> staging, main -> production. Pull requests only run the checks and the
# image build; nothing is pushed from them. Deploys are done by Render itself
# (render.yaml, autoDeployTrigger: checksPass) once these checks pass.
on:
  push:
    branches: [ "Dev", "main" ]
  pull_request:
    branches: [ "Dev", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest

    # Required permissions to push to GitHub Container Registry (GHCR)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image repository
        # GHCR requires a lowercase repository name, but github.repository
        # preserves this repo's actual case (Drate-Hillary/resolv-hq-backend).
        run: echo "IMAGE_REPOSITORY=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ env.IMAGE_REPOSITORY }}:${{ github.ref_name == 'main' && 'latest' || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
